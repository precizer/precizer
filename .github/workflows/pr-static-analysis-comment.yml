name: PR static analysis comment

on:
  workflow_run:
    workflows:
      - PR static analysis
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  filter:
    name: Check analyzed branch
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-24.04

    outputs:
      is_version_pr: ${{ steps.branch_filter.outputs.is_version_pr }}

    steps:
      - name: Check source branch name
        id: branch_filter
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${HEAD_BRANCH}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_version_pr=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_version_pr=false" >> "${GITHUB_OUTPUT}"
          fi

  comment:
    name: Comment on PR
    needs: filter
    if: ${{ github.event.workflow_run.event == 'pull_request' && needs.filter.outputs.is_version_pr == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Download static analysis artifact
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set +e

          mkdir -p artifact
          gh run download "${RUN_ID}" --name pr-static-analysis-results --dir artifact
          status=$?

          if [ "${status}" -eq 0 ]; then
            echo "artifact_found=true" >> "${GITHUB_OUTPUT}"
          else
            echo "artifact_found=false" >> "${GITHUB_OUTPUT}"
          fi

          exit 0

      - name: Prepare PR comment
        id: prepare
        env:
          ARTIFACT_FOUND: ${{ steps.download.outputs.artifact_found }}
          PR_NUMBER_FALLBACK: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail

          COMMENT_PATH=artifact/comment.md
          REPORT_PATH=artifact/report.md
          PR_NUMBER=

          if [ -f artifact/pr_number.txt ]; then
            PR_NUMBER="$(tr -d '\n' < artifact/pr_number.txt)"
          elif [ -n "${PR_NUMBER_FALLBACK}" ]; then
            PR_NUMBER="${PR_NUMBER_FALLBACK}"
          fi

          if [ -z "${PR_NUMBER}" ]; then
            echo "Unable to determine pull request number" >&2
            exit 1
          fi

          if [ "${ARTIFACT_FOUND}" = "true" ] && [ -f "${REPORT_PATH}" ]; then
            cp "${REPORT_PATH}" "${COMMENT_PATH}"
          else
            {
              echo "# Static analysis"
              echo
              echo ":warning: Static analysis workflow finished without a downloadable report"
              echo
              echo "- Pull request: #${PR_NUMBER}"
              echo "- Workflow conclusion: \`${WORKFLOW_CONCLUSION}\`"
              echo "- Workflow run: ${RUN_URL}"
            } > "${COMMENT_PATH}"
          fi

          echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Update sticky PR comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          number: ${{ steps.prepare.outputs.pr_number }}
          header: static-analysis
          path: artifact/comment.md
