# Complete build & test matrix across all platforms.
#
# 1) "discover" scans .docker/Dockerfile.* and emits a JSON list of OS names.
# 2) "test" uses strategy.matrix to spawn one parallel job per OS and CPU
#    architecture. Each job runs on its own runner simultaneously. fail-fast is
#    disabled so that a failure in one target does not cancel the others.
name: Complete build & test matrix across all platforms

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover OS list
    runs-on: ubuntu-24.04
    outputs:
      os-list: ${{ steps.scan.outputs.os-list }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .docker

      - name: Scan .docker/Dockerfile.* for OS names
        id: scan
        run: |
          os_list=$(ls .docker/Dockerfile.* 2>/dev/null \
            | sed 's|.*/Dockerfile\.||' \
            | sort \
            | jq -Rsc 'split("\n") | map(select(. != ""))')
          echo "os-list=$os_list" >> "$GITHUB_OUTPUT"
          echo "Discovered: $os_list"

  test:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    needs: discover
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: ${{ fromJson(needs.discover.outputs.os-list) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
        exclude:
          # Temporary exclusion: Docker Hub lists the official archlinux image as amd64-only
          # https://hub.docker.com/_/archlinux/
          - os: arch
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build and test (${{ matrix.os }})
        run: make docker-check-os-${{ matrix.os }}
