# Complete build & test matrix across all platforms.
#
# 1) "discover" scans .docker/Dockerfile.* and emits a JSON list of OS names.
# 2) "test" uses strategy.matrix to spawn one parallel job per OS — each job
#    runs on its own runner simultaneously.  fail-fast is disabled so that
#    a failure in one OS does not cancel the others.
name: Complete build & test matrix across all platforms

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover OS list
    runs-on: ubuntu-24.04
    outputs:
      os-list: ${{ steps.scan.outputs.os-list }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout: .docker

      - name: Scan .docker/Dockerfile.* for OS names
        id: scan
        run: |
          os_list=$(ls .docker/Dockerfile.* 2>/dev/null \
            | sed 's|.*/Dockerfile\.||' \
            | sort \
            | jq -Rsc 'split("\n") | map(select(. != ""))')
          echo "os-list=$os_list" >> "$GITHUB_OUTPUT"
          echo "Discovered: $os_list"

  test:
    name: ${{ matrix.os }}
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: ${{ fromJson(needs.discover.outputs.os-list) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Build and test (${{ matrix.os }})
        run: make docker-check-os-${{ matrix.os }}
