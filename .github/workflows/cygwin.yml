name: Cygwin build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build portable executable
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf input

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !tests/fixtures/long/**

      - name: Install Cygwin dependencies
        id: install-cygwin
        uses: cygwin/cygwin-install-action@3f0a3f9f988f7e96b8c18098ae05eaec175f5b52 # v6
        with:
          packages: |
            gcc-core
            libargp-devel
            libpcre2-devel
            libsqlite3-devel
            make
            upx

      - name: Build and stage Cygwin executable
        shell: bash --noprofile --norc -e -o pipefail -o igncr {0}
        run: |
          set -euo pipefail

          case "$(uname -s)" in
            CYGWIN*) ;;
            *)
              echo "Expected Cygwin shell, got $(uname -s)" >&2
              exit 1
              ;;
          esac

          project_dir="$(cygpath -u "$GITHUB_WORKSPACE")"

          cd "$project_dir"
          make dynamic-production WFLAGS=

          built_exe=".builds/dynamic-production/precizer.exe"
          if [ ! -f "$built_exe" ]; then
            built_exe=".builds/dynamic-production/precizer"
          fi
          if [ ! -f "$built_exe" ]; then
            echo "Dynamic production executable not found" >&2
            exit 1
          fi

          rm -rf package
          mkdir -p package/cygwin
          cp "$built_exe" package/cygwin/precizer.exe

          cygcheck "$built_exe" | tee package/cygwin-dependencies.txt
          while IFS= read -r dependency
          do
            dependency="${dependency#"${dependency%%[![:space:]]*}"}"
            if [[ "$dependency" != *.dll ]]; then
              continue
            fi

            dependency_unix="$(cygpath -u "$dependency" 2>/dev/null || true)"
            if [ -z "$dependency_unix" ]; then
              continue
            fi

            dependency_name="$(basename "$dependency_unix")"
            if [[ -f "$dependency_unix" && "$dependency_name" == cyg*.dll ]]; then
              cp -f "$dependency_unix" package/cygwin/
            fi
          done < package/cygwin-dependencies.txt

          test -f package/cygwin/cygwin1.dll
          test -f package/cygwin/cygargp-0.dll
          test -f package/cygwin/cygpcre2-8-0.dll
          test -f package/cygwin/cygsqlite3-0.dll

          ls -la package/cygwin

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build portable wrapper with NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = "${env:ProgramFiles}\NSIS\makensis.exe"
          }
          if (-not (Test-Path $makensis)) {
            throw "makensis.exe was not found"
          }

          $script = Join-Path $env:GITHUB_WORKSPACE ".github\workflows\cygwin.nsi"
          $staging = Join-Path $env:GITHUB_WORKSPACE "package\cygwin"
          $output = Join-Path $env:GITHUB_WORKSPACE "package\precizer.exe"

          & $makensis /NOCD "/DOUTPUT_EXE=$output" "/DSTAGING_DIR=$staging" $script
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path $output)) {
            throw "Portable executable was not created"
          }

      - name: Run portable executable outside Cygwin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $portable = Join-Path $env:GITHUB_WORKSPACE "package\precizer.exe"
          Write-Output "Running portable executable outside Cygwin: $portable --version"

          & $portable --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
