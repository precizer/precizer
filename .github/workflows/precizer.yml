permissions:
  contents: read

name: Release builds

on:
  push:
    tags:
      - "*.*.*"

jobs:
  get_tag_info:
    name: Get tag info & create release
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.tag_message.outputs.version }}
      body: ${{ steps.tag_message.outputs.body }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Get annotated tag message
        id: tag_message
        run: |
          git fetch --depth=1 origin +refs/tags/*:refs/tags/*

          VERSION="${GITHUB_REF#refs/tags/}"

          {
            echo "version=$VERSION"
            echo 'body<<EOF'
            git tag -l --format='%(contents)' "$VERSION"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with gh CLI
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "v${{ github.ref_name }}" \
            --notes "${{ steps.tag_message.outputs.body }}" \
            --draft

  build_linux_x86_64:
    name: Build & attach Linux x86_64
    runs-on: ubuntu-24.04
    needs: get_tag_info

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      VERSION: ${{ needs.get_tag_info.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make libpcre2-dev llvm upx gh

      - name: Build project (Linux x86_64)
        run: |
          make -j portable
          mkdir v${{ env.VERSION }}
          cp -a precizer v${{ env.VERSION }}/
          zip -9 -r precizer_linux_x86_64_portable.zip v${{ env.VERSION }}/ COPYING README.ru.md README.md CHANGELOG.md
          ZIP_COMMENT="Linux x86_64 static portable binary (single executable)"
          echo "$ZIP_COMMENT" | zip -z precizer_linux_x86_64_portable.zip
          ./precizer --version
          make purge

      - name: Run tests (Linux x86_64)
        run: make -j tests

      - name: Generate attestation (Linux x86_64)
        id: attest_linux_x86_64
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: precizer_linux_x86_64_portable.zip

      - name: Save Sigstore bundle (Linux x86_64)
        run: |
          cp "${{ steps.attest_linux_x86_64.outputs.bundle-path }}" \
             "precizer_linux_x86_64_portable.zip.sigstore.json"

      - name: Upload Sigstore bundle artifact (Linux x86_64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sigstore-bundle-linux-x86-64
          path: precizer_linux_x86_64_portable.zip.sigstore.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload Linux x86_64 asset
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            "precizer_linux_x86_64_portable.zip" \
            "precizer_linux_x86_64_portable.zip.sigstore.json" \
            --clobber
          #
          # Testing automation for downloading and unarchiving new versions (example from the README documentation)
          #
          # Download
          wget -O precizer.zip -q "https://github.com/precizer/precizer/releases/latest/download/precizer_$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/darwin/macos/')_$(uname -m | sed 's/amd64/x86_64/')$( [ "$(uname -s)" = "Linux" ] && echo '_portable' ).zip"
          wget -O precizer.zip.sigstore.json -q "https://github.com/precizer/precizer/releases/latest/download/precizer_$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/darwin/macos/')_$(uname -m | sed 's/amd64/x86_64/')$( [ "$(uname -s)" = "Linux" ] && echo '_portable' ).zip.sigstore.json"
          # Extract the archive
          unzip -jqo precizer.zip '*/precizer' -d ./
          # Run
          ./precizer --version

  build_linux_arm64:
    name: Build & attach Linux arm64
    runs-on: ubuntu-24.04-arm
    needs: get_tag_info

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      VERSION: ${{ needs.get_tag_info.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make libpcre2-dev llvm gh

      - name: Build project (Linux arm64)
        run: |
          # UPX is disabled on Linux ARM64 because UPX-compressed binaries currently core dump at runtime
          # TODO: Remove this legacy workaround after UPX-compressed Linux ARM64 binaries run reliably
          make -j portable UPX=true
          mkdir v${{ env.VERSION }}
          cp -a .builds/portable/precizer v${{ env.VERSION }}/
          zip -9 -r precizer_linux_aarch64_portable.zip v${{ env.VERSION }}/ COPYING README.ru.md README.md CHANGELOG.md
          ZIP_COMMENT="Linux arm64 static portable binary (single executable)"
          echo "$ZIP_COMMENT" | zip -z precizer_linux_aarch64_portable.zip
          ./.builds/portable/precizer --version
          make purge

      - name: Run tests (Linux arm64)
        run: make -j tests

      - name: Generate attestation (Linux arm64)
        id: attest_linux_arm64
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: precizer_linux_aarch64_portable.zip

      - name: Save Sigstore bundle (Linux arm64)
        run: |
          cp "${{ steps.attest_linux_arm64.outputs.bundle-path }}" \
             "precizer_linux_aarch64_portable.zip.sigstore.json"

      - name: Upload Sigstore bundle artifact (Linux arm64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sigstore-bundle-linux-arm64
          path: precizer_linux_aarch64_portable.zip.sigstore.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload Linux arm64 asset
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            "precizer_linux_aarch64_portable.zip" \
            "precizer_linux_aarch64_portable.zip.sigstore.json" \
            --clobber
          #
          # Testing automation for downloading and unarchiving new versions (example from the README documentation)
          #
          # Download
          wget -O precizer.zip -q "https://github.com/precizer/precizer/releases/latest/download/precizer_$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/darwin/macos/')_$(uname -m | sed 's/amd64/x86_64/')$( [ "$(uname -s)" = "Linux" ] && echo '_portable' ).zip"
          wget -O precizer.zip.sigstore.json -q "https://github.com/precizer/precizer/releases/latest/download/precizer_$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/darwin/macos/')_$(uname -m | sed 's/amd64/x86_64/')$( [ "$(uname -s)" = "Linux" ] && echo '_portable' ).zip.sigstore.json"
          # Extract the archive
          unzip -jqo precizer.zip '*/precizer' -d ./
          # Run
          ./precizer --version

  build_evil_empire_os_arm64:
    name: Build & attach macOS arm64
    runs-on: macos-latest
    needs: get_tag_info

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      VERSION: ${{ needs.get_tag_info.outputs.version }}

    steps:
      - name: Checkout repository (exclude tests/fixtures/long)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !tests/fixtures/long/**

      - name: Install dependencies
        run: |
          brew update
          brew install llvm argp-standalone || true

      - name: Build project (macOS arm64)
        run: |
          make -j dynamic-production
          otool -L precizer
          otool -l precizer
          mkdir v${{ env.VERSION }}
          cp -a precizer v${{ env.VERSION }}/
          zip -9 -r precizer_macos_arm64.zip v${{ env.VERSION }}/ COPYING README.ru.md README.md CHANGELOG.md
          ./precizer --version
          make purge

      - name: Run tests (macOS arm64)
        run: make -j tests

      - name: Generate attestation (macOS arm64)
        id: attest_macos_arm64
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: precizer_macos_arm64.zip

      - name: Save Sigstore bundle (macOS arm64)
        run: |
          cp "${{ steps.attest_macos_arm64.outputs.bundle-path }}" \
             "precizer_macos_arm64.zip.sigstore.json"

      - name: Upload Sigstore bundle artifact (macOS arm64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sigstore-bundle-macos-arm64
          path: precizer_macos_arm64.zip.sigstore.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload macOS arm64 asset
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            "precizer_macos_arm64.zip" \
            "precizer_macos_arm64.zip.sigstore.json" \
            --clobber
          #
          # Testing automation for downloading and unarchiving new versions (example from the README documentation)
          #
          # Download
          wget -O precizer.zip -q "https://github.com/precizer/precizer/releases/latest/download/precizer_$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/darwin/macos/')_$(uname -m | sed 's/amd64/x86_64/')$( [ "$(uname -s)" = "Linux" ] && echo '_portable' ).zip"
          wget -O precizer.zip.sigstore.json -q "https://github.com/precizer/precizer/releases/latest/download/precizer_$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/darwin/macos/')_$(uname -m | sed 's/amd64/x86_64/')$( [ "$(uname -s)" = "Linux" ] && echo '_portable' ).zip.sigstore.json"
          # Extract the archive
          unzip -jqo precizer.zip '*/precizer' -d ./
          # Run
          ./precizer --version

  # Build and attach the MSYS-based Windows x64 release assets
  build_msys_x64:
    name: Build & attach MSYS x64

    # Run the Windows-specific packaging workflow after the release tag metadata is ready
    runs-on: windows-latest
    needs: get_tag_info

    # Allow this job to read sources and publish artifact attestations
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    # Reuse the tag version detected by the release metadata job
    env:
      VERSION: ${{ needs.get_tag_info.outputs.version }}

    steps:
      # Keep checked-out shell scripts and generated files in Unix line-ending form
      - name: Configure Git line endings
        run: git config --global core.autocrlf input

      # Fetch the source tree while skipping the long filesystem fixture set
      - name: Checkout repository (exclude tests/fixtures/long)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !tests/fixtures/long/**

      # Install the MSYS toolchain, payload libraries, and UCRT launcher tools
      - name: Install MSYS dependencies
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MSYS
          update: true
          install: >-
            gcc
            make
            libsqlite-devel
            pcre2-devel
            libargp-devel
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-upx
            zip

      # Compile the MSYS payload, package its runtime files, and build the native launcher
      - name: Build MSYS payload and native launcher
        shell: msys2 {0}
        run: |
          set -euo pipefail

          # Build the MSYS payload with static third-party libraries
          make dynamic-production \
            WFLAGS= \
            UPX=true \
            LTO= \
            PROD_OPT_CFLAGS='-pipe -fbuiltin -O2 -mtune=generic -ffunction-sections -fdata-sections -fomit-frame-pointer' \
            PROD_LDFLAGS='-Wl,-O2 -Wl,--gc-sections' \
            DYNP_SHARED_LIBS='/usr/lib/libsqlite3.a /usr/lib/libpcre2-8.a /usr/lib/libargp.a'

          # Resolve the executable produced by the dynamic production build
          built_exe=".builds/dynamic-production/precizer.exe"
          if [ ! -f "$built_exe" ]; then
            built_exe=".builds/dynamic-production/precizer"
          fi

          # Stop if the build did not produce an executable
          if [ ! -f "$built_exe" ]; then
            echo "Dynamic production executable not found" >&2
            exit 1
          fi

          # Prepare the payload files used by the zip archive and native launcher
          rm -rf package
          mkdir -p package/msys
          cp "$built_exe" package/msys/precizer.exe
          cp /usr/bin/msys-2.0.dll package/msys/msys-2.0.dll

          # Verify that the payload keeps only the expected MSYS runtime dependency
          cygcheck package/msys/precizer.exe | tee package/msys-dependencies.txt
          if ! grep -qi 'msys-2\.0\.dll' package/msys-dependencies.txt; then
            echo "The MSYS payload does not depend on msys-2.0.dll as expected" >&2
            exit 1
          fi
          if grep -Eiq 'msys-(argp|pcre2|sqlite3?|gcc|stdc\+\+|winpthread).*\.dll' package/msys-dependencies.txt; then
            echo "The MSYS payload still has an unexpected dynamic MSYS dependency" >&2
            exit 1
          fi

          # Build the native launcher that embeds the payload files
          make -C .packaging/msys

          # Compress the native launcher with the UCRT-native UPX package
          /ucrt64/bin/upx --best --lzma -qqq ./precizer_windows_x64_portable.exe

          # Verify the compressed executable before dependency and runtime checks
          /ucrt64/bin/upx -t ./precizer_windows_x64_portable.exe

          # Verify that the launcher does not import MSYS2 DLLs from the runner
          cygcheck ./precizer_windows_x64_portable.exe | tee package/msys-launcher-dependencies.txt
          if grep -Eiq '\\msys64\\(usr|ucrt64)\\bin\\.*\.dll' package/msys-launcher-dependencies.txt; then
            echo "The native launcher imports an MSYS2 runtime DLL instead of embedding it only" >&2
            exit 1
          fi

      # Confirm that the self-extracting launcher works without MSYS2 on PATH
      - name: Run native launcher outside MSYS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Remove MSYS2 directories from PATH to simulate a clean Windows environment
          $env:Path = (($env:Path -split ';') | Where-Object { $_ -notmatch '\\msys64\\' }) -join ';'

          # Run the launcher and forward its exit code to the workflow
          $precizer = Join-Path $env:GITHUB_WORKSPACE "precizer_windows_x64_portable.exe"
          & $precizer --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # Create the zip distribution with the MSYS payload files
      - name: Create MSYS x64 archive
        shell: msys2 {0}
        run: |
          set -euo pipefail

          # Recreate the versioned archive root directory
          version_dir="v${VERSION}"
          rm -rf "$version_dir"
          mkdir -p "$version_dir"

          # Copy the executable and its MSYS runtime into the archive root
          cp -a package/msys/precizer.exe "$version_dir/"
          cp -a package/msys/msys-2.0.dll "$version_dir/"

          # Print the archive root contents for the workflow log
          ls -la "$version_dir"

          # Compress the archive root into the release zip asset
          rm -f precizer_windows_x64_portable.zip
          zip -9 -r precizer_windows_x64_portable.zip "$version_dir/" COPYING README.ru.md README.md CHANGELOG.md

      # Generate a Sigstore attestation for the self-extracting executable
      - name: Generate attestation (MSYS x64 self-extracting exe)
        id: attest_windows_x64_exe
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: precizer_windows_x64_portable.exe

      # Save the executable attestation bundle under the release asset name
      - name: Save Sigstore bundle (MSYS x64 self-extracting exe)
        shell: pwsh
        run: |
          # Copy the generated bundle from the action output path
          Copy-Item `
            -Path "${{ steps.attest_windows_x64_exe.outputs.bundle-path }}" `
            -Destination "precizer_windows_x64_portable.exe.sigstore.json"

      # Generate a Sigstore attestation for the zip distribution
      - name: Generate attestation (MSYS x64 zip)
        id: attest_windows_x64_zip
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: precizer_windows_x64_portable.zip

      # Save the zip attestation bundle under the release asset name
      - name: Save Sigstore bundle (MSYS x64 zip)
        shell: pwsh
        run: |
          # Copy the generated bundle from the action output path
          Copy-Item `
            -Path "${{ steps.attest_windows_x64_zip.outputs.bundle-path }}" `
            -Destination "precizer_windows_x64_portable.zip.sigstore.json"

      # Preserve both Sigstore bundles for the final release provenance job
      - name: Upload Sigstore bundle artifact (MSYS x64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sigstore-bundle-msys-x64
          path: |
            precizer_windows_x64_portable.exe.sigstore.json
            precizer_windows_x64_portable.zip.sigstore.json
          if-no-files-found: error
          retention-days: 1

      # Attach the Windows x64 release assets and their Sigstore bundles to the GitHub Release
      - name: Upload MSYS x64 asset
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Upload all Windows x64 assets for the current tag and replace stale copies
          gh release upload ${{ github.ref_name }} `
            "precizer_windows_x64_portable.exe" `
            "precizer_windows_x64_portable.exe.sigstore.json" `
            "precizer_windows_x64_portable.zip" `
            "precizer_windows_x64_portable.zip.sigstore.json" `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          #
          # Testing automation for downloading and unarchiving new versions (example from the README documentation)
          #
          # Download
          $downloadBase = "https://github.com/precizer/precizer/releases/latest/download"
          Invoke-WebRequest `
            -Uri "$downloadBase/precizer_windows_x64_portable.exe" `
            -OutFile "downloaded_precizer_windows_x64_portable.exe"
          Invoke-WebRequest `
            -Uri "$downloadBase/precizer_windows_x64_portable.exe.sigstore.json" `
            -OutFile "downloaded_precizer_windows_x64_portable.exe.sigstore.json"
          Invoke-WebRequest `
            -Uri "$downloadBase/precizer_windows_x64_portable.zip" `
            -OutFile "downloaded_precizer_windows_x64_portable.zip"
          Invoke-WebRequest `
            -Uri "$downloadBase/precizer_windows_x64_portable.zip.sigstore.json" `
            -OutFile "downloaded_precizer_windows_x64_portable.zip.sigstore.json"

          # Remove MSYS2 directories from PATH to simulate a clean Windows environment
          $env:Path = (($env:Path -split ';') | Where-Object { $_ -notmatch '\\msys64\\' }) -join ';'

          # Run the downloaded self-extracting launcher
          $downloadedLauncher = Join-Path $PWD.Path "downloaded_precizer_windows_x64_portable.exe"
          & $downloadedLauncher --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          # Extract the downloaded zip distribution
          $downloadedZipDir = Join-Path $PWD.Path "downloaded_windows_zip"
          Remove-Item -Path $downloadedZipDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $downloadedZipDir | Out-Null
          Expand-Archive `
            -Path "downloaded_precizer_windows_x64_portable.zip" `
            -DestinationPath $downloadedZipDir `
            -Force

          # Verify that the archive contains the expected executable and MSYS runtime
          $downloadedPayload = Get-ChildItem `
            -LiteralPath $downloadedZipDir `
            -Filter "precizer.exe" `
            -File `
            -Recurse | Select-Object -First 1
          if ($null -eq $downloadedPayload) {
            throw "The downloaded Windows zip does not contain precizer.exe"
          }
          $downloadedRuntime = Join-Path $downloadedPayload.DirectoryName "msys-2.0.dll"
          if (!(Test-Path -LiteralPath $downloadedRuntime -PathType Leaf)) {
            throw "The downloaded Windows zip does not contain msys-2.0.dll"
          }

          # Run the executable from the downloaded zip
          & ($downloadedPayload.FullName) --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  upload_release_provenance:
    name: Upload release provenance
    runs-on: ubuntu-24.04
    needs:
      - get_tag_info
      - build_linux_x86_64
      - build_linux_arm64
      - build_evil_empire_os_arm64
      - build_msys_x64

    permissions:
      contents: read

    env:
      VERSION: ${{ needs.get_tag_info.outputs.version }}

    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gh jq

      - name: Download Sigstore bundle artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-sigstore-bundle-*
          path: release-sigstore-bundles
          merge-multiple: true

      - name: Create release provenance
        run: |
          set -euo pipefail

          provenance_file="precizer_${VERSION}.intoto.jsonl"
          jq -c -e '.dsseEnvelope | if type == "object" then . else error("missing dsseEnvelope") end' \
            release-sigstore-bundles/precizer_linux_x86_64_portable.zip.sigstore.json \
            release-sigstore-bundles/precizer_linux_aarch64_portable.zip.sigstore.json \
            release-sigstore-bundles/precizer_macos_arm64.zip.sigstore.json \
            release-sigstore-bundles/precizer_windows_x64_portable.exe.sigstore.json \
            release-sigstore-bundles/precizer_windows_x64_portable.zip.sigstore.json \
            > "$provenance_file"

          line_count="$(wc -l < "$provenance_file" | tr -d '[:space:]')"
          test "$line_count" -eq 5

      - name: Upload release provenance
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            "precizer_${VERSION}.intoto.jsonl" \
            --clobber
