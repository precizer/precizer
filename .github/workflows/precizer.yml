name: Precizer

on:
  push:
    tags:
      - "*.*.*"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get annotated tag message
        id: tag_message
        run: |
          git fetch --depth=1 origin +refs/tags/*:refs/tags/*
          echo "BODY=$(git tag -l --format='%(contents)' ${{ github.ref_name }})" >> $GITHUB_ENV
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make libpcre2-dev llvm upx gh

      - name: Build project (x64)
        run: |
          make portable
          zip --junk-paths precizer_v${{ env.VERSION }}.zip precizer

      - name: Run tests (x64)
        run: make tests

      - name: Create GitHub Release with gh CLI
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} precizer_v${{ env.VERSION }}.zip \
            --title "v${{ github.ref_name }}" \
            --notes "${{ env.BODY }}" \
            --draft

  build_arm64:
    name: Build & attach arm64 artifact
    runs-on: ubuntu-24.04-arm
    needs: build
    env:
      GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make libpcre2-dev llvm upx gh

      - name: Build project (arm64)
        run: |
          make portable
          zip --junk-paths precizer_arm64_v${{ env.VERSION }}.zip precizer

      - name: Run tests (arm64)
        run: make tests

      - name: Upload arm64 artifact to existing release
        run: |
          gh release upload ${{ github.ref_name }} precizer_arm64_v${{ env.VERSION }}.zip --clobber
