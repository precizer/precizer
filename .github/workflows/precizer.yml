permissions:
  contents: read

name: Release builds

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

jobs:
  get_tag_info:
    name: Get tag info & create release
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.tag_message.outputs.version }}
      body: ${{ steps.tag_message.outputs.body }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Get annotated tag message
        id: tag_message
        run: |
          git fetch --depth=1 origin +refs/tags/*:refs/tags/*

          VERSION="${GITHUB_REF#refs/tags/}"

          {
            echo "version=$VERSION"
            echo 'body<<EOF'
            git tag -l --format='%(contents)' "$VERSION"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with gh CLI
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "v${{ github.ref_name }}" \
            --notes "${{ steps.tag_message.outputs.body }}" \
            --draft

  build_linux_x86_64:
    name: Build & attach Linux x86_64
    runs-on: ubuntu-24.04
    needs: get_tag_info

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      VERSION: ${{ needs.get_tag_info.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make libpcre2-dev llvm upx gh

      - name: Build project (Linux x86_64)
        run: |
          make -j portable
          mkdir v${{ env.VERSION }}
          cp -a precizer v${{ env.VERSION }}/
          zip -r precizer_linux_x86_64_portable.zip v${{ env.VERSION }}/
          ZIP_COMMENT="Linux x86_64 static portable binary (single executable)"
          echo "$ZIP_COMMENT" | zip -z precizer_linux_x86_64_portable.zip
          ./precizer --version
          make purge

      - name: Run tests (Linux x86_64)
        run: make -j tests

      - name: Generate attestation (Linux x86_64)
        id: attest_linux_x86_64
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: precizer_linux_x86_64_portable.zip

      - name: Save Sigstore bundle (Linux x86_64)
        run: |
          cp "${{ steps.attest_linux_x86_64.outputs.bundle-path }}" \
             "precizer_linux_x86_64_portable.zip.sigstore.json"

      - name: Upload Sigstore bundle artifact (Linux x86_64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sigstore-bundle-linux-x86-64
          path: precizer_linux_x86_64_portable.zip.sigstore.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload Linux x86_64 asset
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            "precizer_linux_x86_64_portable.zip" \
            "precizer_linux_x86_64_portable.zip.sigstore.json" \
            --clobber
          #
          # Testing automation for downloading and unarchiving new versions (example from the README documentation)
          #
          # Download
          wget -O precizer.zip -q "https://github.com/precizer/precizer/releases/latest/download/precizer_$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/darwin/macos/')_$(uname -m | sed 's/amd64/x86_64/')$( [ "$(uname -s)" = "Linux" ] && echo '_portable' ).zip"
          wget -O precizer.zip.sigstore.json -q "https://github.com/precizer/precizer/releases/latest/download/precizer_$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/darwin/macos/')_$(uname -m | sed 's/amd64/x86_64/')$( [ "$(uname -s)" = "Linux" ] && echo '_portable' ).zip.sigstore.json"
          # Extract the archive
          unzip -jqo precizer.zip '*/precizer' -d ./
          # Run
          ./precizer --version

  build_linux_arm64:
    name: Build & attach Linux arm64
    runs-on: ubuntu-24.04-arm
    needs: get_tag_info

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      VERSION: ${{ needs.get_tag_info.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make libpcre2-dev llvm gh

      - name: Build project (Linux arm64)
        run: |
          # UPX is disabled on Linux ARM64 because UPX-compressed binaries currently core dump at runtime
          # TODO: Remove this legacy workaround after UPX-compressed Linux ARM64 binaries run reliably
          make -j portable UPX=true
          mkdir v${{ env.VERSION }}
          cp -a .builds/portable/precizer v${{ env.VERSION }}/
          zip -r precizer_linux_aarch64_portable.zip v${{ env.VERSION }}/
          ZIP_COMMENT="Linux arm64 static portable binary (single executable)"
          echo "$ZIP_COMMENT" | zip -z precizer_linux_aarch64_portable.zip
          ./.builds/portable/precizer --version
          make purge

      - name: Run tests (Linux arm64)
        run: make -j tests

      - name: Generate attestation (Linux arm64)
        id: attest_linux_arm64
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: precizer_linux_aarch64_portable.zip

      - name: Save Sigstore bundle (Linux arm64)
        run: |
          cp "${{ steps.attest_linux_arm64.outputs.bundle-path }}" \
             "precizer_linux_aarch64_portable.zip.sigstore.json"

      - name: Upload Sigstore bundle artifact (Linux arm64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sigstore-bundle-linux-arm64
          path: precizer_linux_aarch64_portable.zip.sigstore.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload Linux arm64 asset
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            "precizer_linux_aarch64_portable.zip" \
            "precizer_linux_aarch64_portable.zip.sigstore.json" \
            --clobber
          #
          # Testing automation for downloading and unarchiving new versions (example from the README documentation)
          #
          # Download
          wget -O precizer.zip -q "https://github.com/precizer/precizer/releases/latest/download/precizer_$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/darwin/macos/')_$(uname -m | sed 's/amd64/x86_64/')$( [ "$(uname -s)" = "Linux" ] && echo '_portable' ).zip"
          wget -O precizer.zip.sigstore.json -q "https://github.com/precizer/precizer/releases/latest/download/precizer_$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/darwin/macos/')_$(uname -m | sed 's/amd64/x86_64/')$( [ "$(uname -s)" = "Linux" ] && echo '_portable' ).zip.sigstore.json"
          # Extract the archive
          unzip -jqo precizer.zip '*/precizer' -d ./
          # Run
          ./precizer --version

  build_evil_empire_os_arm64:
    name: Build & attach macOS arm64
    runs-on: macos-latest
    needs: get_tag_info

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      VERSION: ${{ needs.get_tag_info.outputs.version }}

    steps:
      - name: Checkout repository (exclude tests/fixtures/long)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !tests/fixtures/long/**

      - name: Install dependencies
        run: |
          brew update
          brew install llvm argp-standalone || true

      - name: Build project (macOS arm64)
        run: |
          make -j dynamic-production
          otool -L precizer
          otool -l precizer
          mkdir v${{ env.VERSION }}
          cp -a precizer v${{ env.VERSION }}/
          zip -r precizer_macos_arm64.zip v${{ env.VERSION }}/
          ./precizer --version
          make purge

      - name: Run tests (macOS arm64)
        run: make -j tests

      - name: Generate attestation (macOS arm64)
        id: attest_macos_arm64
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: precizer_macos_arm64.zip

      - name: Save Sigstore bundle (macOS arm64)
        run: |
          cp "${{ steps.attest_macos_arm64.outputs.bundle-path }}" \
             "precizer_macos_arm64.zip.sigstore.json"

      - name: Upload Sigstore bundle artifact (macOS arm64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sigstore-bundle-macos-arm64
          path: precizer_macos_arm64.zip.sigstore.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload macOS arm64 asset
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            "precizer_macos_arm64.zip" \
            "precizer_macos_arm64.zip.sigstore.json" \
            --clobber
          #
          # Testing automation for downloading and unarchiving new versions (example from the README documentation)
          #
          # Download
          wget -O precizer.zip -q "https://github.com/precizer/precizer/releases/latest/download/precizer_$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/darwin/macos/')_$(uname -m | sed 's/amd64/x86_64/')$( [ "$(uname -s)" = "Linux" ] && echo '_portable' ).zip"
          wget -O precizer.zip.sigstore.json -q "https://github.com/precizer/precizer/releases/latest/download/precizer_$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/darwin/macos/')_$(uname -m | sed 's/amd64/x86_64/')$( [ "$(uname -s)" = "Linux" ] && echo '_portable' ).zip.sigstore.json"
          # Extract the archive
          unzip -jqo precizer.zip '*/precizer' -d ./
          # Run
          ./precizer --version

  build_msys_x64:
    name: Build & attach MSYS x64
    runs-on: windows-latest
    needs: get_tag_info

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      VERSION: ${{ needs.get_tag_info.outputs.version }}

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf input

      - name: Checkout repository (exclude tests/fixtures/long)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !tests/fixtures/long/**

      - name: Install MSYS dependencies
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MSYS
          update: true
          install: >-
            gcc
            make
            libsqlite-devel
            pcre2-devel
            libargp-devel
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-gcc

      - name: Build MSYS payload and native launcher
        shell: msys2 {0}
        run: |
          set -euo pipefail

          make dynamic-production \
            WFLAGS= \
            UPX=true \
            LTO= \
            PROD_OPT_CFLAGS='-pipe -fbuiltin -O2 -mtune=generic -ffunction-sections -fdata-sections -fomit-frame-pointer' \
            PROD_LDFLAGS='-Wl,-O2 -Wl,--gc-sections' \
            DYNP_SHARED_LIBS='/usr/lib/libsqlite3.a /usr/lib/libpcre2-8.a /usr/lib/libargp.a'

          built_exe=".builds/dynamic-production/precizer.exe"
          if [ ! -f "$built_exe" ]; then
            built_exe=".builds/dynamic-production/precizer"
          fi
          if [ ! -f "$built_exe" ]; then
            echo "Dynamic production executable not found" >&2
            exit 1
          fi

          rm -rf package
          mkdir -p package/msys
          cp "$built_exe" package/msys/precizer.exe
          cp /usr/bin/msys-2.0.dll package/msys/msys-2.0.dll

          cygcheck package/msys/precizer.exe | tee package/msys-dependencies.txt
          if ! grep -qi 'msys-2\.0\.dll' package/msys-dependencies.txt; then
            echo "The MSYS payload does not depend on msys-2.0.dll as expected" >&2
            exit 1
          fi
          if grep -Eiq 'msys-(argp|pcre2|sqlite3?|gcc|stdc\+\+|winpthread).*\.dll' package/msys-dependencies.txt; then
            echo "The MSYS payload still has an unexpected dynamic MSYS dependency" >&2
            exit 1
          fi

          make -C .packaging/msys

          cygcheck ./precizer_windows_x64_portable.exe | tee package/msys-launcher-dependencies.txt
          if grep -Eiq '\\msys64\\(usr|ucrt64)\\bin\\.*\.dll' package/msys-launcher-dependencies.txt; then
            echo "The native launcher imports an MSYS2 runtime DLL instead of embedding it only" >&2
            exit 1
          fi

      - name: Run native launcher outside MSYS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $env:Path = (($env:Path -split ';') | Where-Object { $_ -notmatch '\\msys64\\' }) -join ';'
          $precizer = Join-Path $env:GITHUB_WORKSPACE "precizer_windows_x64_portable.exe"
          & $precizer --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Create MSYS x64 archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $versionDir = "v${env:VERSION}"
          Remove-Item -Path $versionDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $versionDir | Out-Null
          Copy-Item -Path "package\msys\precizer.exe" -Destination $versionDir
          Copy-Item -Path "package\msys\msys-2.0.dll" -Destination $versionDir
          Get-ChildItem -Path $versionDir | Format-Table -AutoSize

          Compress-Archive `
            -Path $versionDir `
            -DestinationPath "precizer_windows_x64_portable.zip" `
            -Force

      - name: Generate attestation (MSYS x64 self-extracting exe)
        id: attest_windows_x64_exe
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: precizer_windows_x64_portable.exe

      - name: Save Sigstore bundle (MSYS x64 self-extracting exe)
        shell: pwsh
        run: |
          Copy-Item `
            -Path "${{ steps.attest_windows_x64_exe.outputs.bundle-path }}" `
            -Destination "precizer_windows_x64_portable.exe.sigstore.json"

      - name: Generate attestation (MSYS x64 zip)
        id: attest_windows_x64_zip
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: precizer_windows_x64_portable.zip

      - name: Save Sigstore bundle (MSYS x64 zip)
        shell: pwsh
        run: |
          Copy-Item `
            -Path "${{ steps.attest_windows_x64_zip.outputs.bundle-path }}" `
            -Destination "precizer_windows_x64_portable.zip.sigstore.json"

      - name: Upload Sigstore bundle artifact (MSYS x64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sigstore-bundle-msys-x64
          path: |
            precizer_windows_x64_portable.exe.sigstore.json
            precizer_windows_x64_portable.zip.sigstore.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload MSYS x64 asset
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} `
            "precizer_windows_x64_portable.exe" `
            "precizer_windows_x64_portable.exe.sigstore.json" `
            "precizer_windows_x64_portable.zip" `
            "precizer_windows_x64_portable.zip.sigstore.json" `
            --clobber

  upload_release_provenance:
    name: Upload release provenance
    runs-on: ubuntu-24.04
    needs:
      - get_tag_info
      - build_linux_x86_64
      - build_linux_arm64
      - build_evil_empire_os_arm64
      - build_msys_x64

    permissions:
      contents: read

    env:
      VERSION: ${{ needs.get_tag_info.outputs.version }}

    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gh jq

      - name: Download Sigstore bundle artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-sigstore-bundle-*
          path: release-sigstore-bundles
          merge-multiple: true

      - name: Create release provenance
        run: |
          set -euo pipefail

          provenance_file="precizer_${VERSION}.intoto.jsonl"
          jq -c -e '.dsseEnvelope | if type == "object" then . else error("missing dsseEnvelope") end' \
            release-sigstore-bundles/precizer_linux_x86_64_portable.zip.sigstore.json \
            release-sigstore-bundles/precizer_linux_aarch64_portable.zip.sigstore.json \
            release-sigstore-bundles/precizer_macos_arm64.zip.sigstore.json \
            release-sigstore-bundles/precizer_windows_x64_portable.exe.sigstore.json \
            release-sigstore-bundles/precizer_windows_x64_portable.zip.sigstore.json \
            > "$provenance_file"

          line_count="$(wc -l < "$provenance_file" | tr -d '[:space:]')"
          test "$line_count" -eq 5

      - name: Upload release provenance
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            "precizer_${VERSION}.intoto.jsonl" \
            --clobber
