  # Build and attach the MSYS-based Windows x64 release assets
  build_msys_x64:
    name: Build & attach MSYS x64

    # Run the Windows-specific packaging workflow after the release tag metadata is ready
    runs-on: windows-latest
    needs: get_tag_info

    # Allow this job to read sources and publish artifact attestations
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    # Build and verify the Windows assets for the release tag
    steps:
      # Keep checked-out shell scripts and generated files in Unix line-ending form
      - name: Configure Git line endings
        run: git config --global core.autocrlf input

      # Fetch the source tree while skipping the long filesystem fixture set
      - name: Checkout repository (exclude tests/fixtures/long)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !tests/fixtures/long/**

      # Install the MSYS toolchain, payload libraries, and UCRT launcher tools
      - name: Install MSYS dependencies
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MSYS
          update: true
          install: >-
            gcc
            make
            libsqlite-devel
            pcre2-devel
            libargp-devel
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-upx
            zip
            unzip

      # Build the Windows ZIP and native launcher through the shared Makefile targets
      - name: Build Windows x64 packages
        shell: msys2 {0}
        run: |
          set -euo pipefail

          # Build both packages with a shared MSYS payload and static third-party libraries
          make windows-zip windows-exe
          mv precizer.zip precizer_windows_x64_portable.zip

          # Locate the executable produced by msys-build
          built_exe=".builds/distribution/precizer.exe"

          # Stop if the build did not produce an executable
          if [ ! -f "$built_exe" ]; then
            echo "Distribution executable not found" >&2
            exit 1
          fi

          # Prepare the reports used to verify both Windows packages
          mkdir -p .builds/msys-reports

          # Verify that the payload keeps only the expected MSYS runtime dependency
          cygcheck "$built_exe" | tee .builds/msys-reports/payload-dependencies.txt
          if ! grep -qi 'msys-2\.0\.dll' .builds/msys-reports/payload-dependencies.txt; then
            echo "The MSYS payload does not depend on msys-2.0.dll as expected" >&2
            exit 1
          fi
          if grep -Eiq 'msys-(argp|pcre2|sqlite3?|gcc|stdc\+\+|winpthread).*\.dll' .builds/msys-reports/payload-dependencies.txt; then
            echo "The MSYS payload still has an unexpected dynamic MSYS dependency" >&2
            exit 1
          fi

          # Require the native launcher produced by windows-exe
          test -f ./precizer_windows_x64_portable.exe

          # Compress the native launcher with the UCRT-native UPX package
          /ucrt64/bin/upx --best --lzma -qqq ./precizer_windows_x64_portable.exe

          # Verify the compressed executable before dependency and runtime checks
          /ucrt64/bin/upx -t ./precizer_windows_x64_portable.exe

          # Verify that the launcher does not import MSYS2 DLLs from the runner
          cygcheck ./precizer_windows_x64_portable.exe | tee .builds/msys-reports/launcher-dependencies.txt
          if grep -Eiq '\\msys64\\(usr|ucrt64)\\bin\\.*\.dll' .builds/msys-reports/launcher-dependencies.txt; then
            echo "The native launcher imports an MSYS2 runtime DLL instead of embedding it only" >&2
            exit 1
          fi

      # Confirm that the self-extracting launcher works without MSYS2 on PATH
      - name: Run native launcher outside MSYS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Remove MSYS2 directories from PATH to simulate a clean Windows environment
          $env:Path = (($env:Path -split ';') | Where-Object { $_ -notmatch '\\msys64\\' }) -join ';'

          # Run the launcher and forward its exit code to the workflow
          $precizer = Join-Path $env:GITHUB_WORKSPACE "precizer_windows_x64_portable.exe"
          & $precizer --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # Verify the ZIP distribution produced by windows-zip
      - name: Verify MSYS x64 archive
        shell: msys2 {0}
        run: |
          set -euo pipefail

          # Prepare a temporary directory for the extracted files
          archive_dir="$(mktemp -d)"

          # Extract the executable and MSYS runtime into the same directory
          unzip -jqo precizer_windows_x64_portable.zip '*/precizer.exe' '*/msys-2.0.dll' -d "$archive_dir"

          # Run the program from the extraction directory
          cd "$archive_dir"

          # Print the version to verify that the extracted program starts
          ./precizer.exe --version

      # Generate a Sigstore attestation for the self-extracting executable
      - name: Generate attestation (MSYS x64 self-extracting exe)
        id: attest_windows_x64_exe
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: precizer_windows_x64_portable.exe

      # Save the executable attestation bundle under the release asset name
      - name: Save Sigstore bundle (MSYS x64 self-extracting exe)
        shell: pwsh
        run: |
          # Copy the generated bundle from the action output path
          Copy-Item `
            -Path "${{ steps.attest_windows_x64_exe.outputs.bundle-path }}" `
            -Destination "precizer_windows_x64_portable.exe.sigstore.json"

      # Generate a Sigstore attestation for the zip distribution
      - name: Generate attestation (MSYS x64 zip)
        id: attest_windows_x64_zip
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: precizer_windows_x64_portable.zip

      # Save the zip attestation bundle under the release asset name
      - name: Save Sigstore bundle (MSYS x64 zip)
        shell: pwsh
        run: |
          # Copy the generated bundle from the action output path
          Copy-Item `
            -Path "${{ steps.attest_windows_x64_zip.outputs.bundle-path }}" `
            -Destination "precizer_windows_x64_portable.zip.sigstore.json"

      # Preserve both Sigstore bundles for the final release provenance job
      - name: Upload Sigstore bundle artifact (MSYS x64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sigstore-bundle-msys-x64
          path: |
            precizer_windows_x64_portable.exe.sigstore.json
            precizer_windows_x64_portable.zip.sigstore.json
          if-no-files-found: error
          retention-days: 1

      # Attach the Windows x64 release assets and their Sigstore bundles to the GitHub Release
      - name: Upload MSYS x64 asset
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Upload all Windows x64 assets for the current tag and replace stale copies
          gh release upload ${{ github.ref_name }} `
            "precizer_windows_x64_portable.exe" `
            "precizer_windows_x64_portable.exe.sigstore.json" `
            "precizer_windows_x64_portable.zip" `
            "precizer_windows_x64_portable.zip.sigstore.json" `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          #
          # Testing automation for downloading and unarchiving new versions (example from the README documentation)
          #
          # Download
          $downloadBase = "https://github.com/precizer/precizer/releases/latest/download"
          Invoke-WebRequest `
            -Uri "$downloadBase/precizer_windows_x64_portable.exe" `
            -OutFile "downloaded_precizer_windows_x64_portable.exe"
          Invoke-WebRequest `
            -Uri "$downloadBase/precizer_windows_x64_portable.exe.sigstore.json" `
            -OutFile "downloaded_precizer_windows_x64_portable.exe.sigstore.json"
          Invoke-WebRequest `
            -Uri "$downloadBase/precizer_windows_x64_portable.zip" `
            -OutFile "downloaded_precizer_windows_x64_portable.zip"
          Invoke-WebRequest `
            -Uri "$downloadBase/precizer_windows_x64_portable.zip.sigstore.json" `
            -OutFile "downloaded_precizer_windows_x64_portable.zip.sigstore.json"

          # Remove MSYS2 directories from PATH to simulate a clean Windows environment
          $env:Path = (($env:Path -split ';') | Where-Object { $_ -notmatch '\\msys64\\' }) -join ';'

          # Run the downloaded self-extracting launcher
          $downloadedLauncher = Join-Path $PWD.Path "downloaded_precizer_windows_x64_portable.exe"
          & $downloadedLauncher --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          # Extract the downloaded zip distribution
          $downloadedZipDir = Join-Path $PWD.Path "downloaded_windows_zip"
          Remove-Item -Path $downloadedZipDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $downloadedZipDir | Out-Null
          Expand-Archive `
            -Path "downloaded_precizer_windows_x64_portable.zip" `
            -DestinationPath $downloadedZipDir `
            -Force

          # Verify that the archive contains the expected executable and MSYS runtime
          $downloadedPayload = Get-ChildItem `
            -LiteralPath $downloadedZipDir `
            -Filter "precizer.exe" `
            -File `
            -Recurse | Select-Object -First 1
          if ($null -eq $downloadedPayload) {
            throw "The downloaded Windows zip does not contain precizer.exe"
          }
          $downloadedRuntime = Join-Path $downloadedPayload.DirectoryName "msys-2.0.dll"
          if (!(Test-Path -LiteralPath $downloadedRuntime -PathType Leaf)) {
            throw "The downloaded Windows zip does not contain msys-2.0.dll"
          }

          # Run the executable from the downloaded zip
          & ($downloadedPayload.FullName) --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  upload_release_provenance:
    name: Upload release provenance
    runs-on: ubuntu-24.04
    needs:
      - get_tag_info
      - build_linux_x86_64
      - build_linux_arm64
      - build_evil_empire_os_arm64
      - build_evil_empire_os_x86_64
      - build_msys_x64

    permissions:
      contents: read

    env:
      VERSION: ${{ needs.get_tag_info.outputs.version }}

    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gh jq

      - name: Download Sigstore bundle artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-sigstore-bundle-*
          path: release-sigstore-bundles
          merge-multiple: true

      - name: Create release provenance
        run: |
          set -euo pipefail

          provenance_file="precizer_${VERSION}.intoto.jsonl"
          jq -c -e '.dsseEnvelope | if type == "object" then . else error("missing dsseEnvelope") end' \
            release-sigstore-bundles/precizer_linux_x86_64_portable.zip.sigstore.json \
            release-sigstore-bundles/precizer_linux_aarch64_portable.zip.sigstore.json \
            release-sigstore-bundles/precizer_macos_arm64.zip.sigstore.json \
            release-sigstore-bundles/precizer_macos_x86_64.zip.sigstore.json \
            release-sigstore-bundles/precizer_windows_x64_portable.exe.sigstore.json \
            release-sigstore-bundles/precizer_windows_x64_portable.zip.sigstore.json \
            > "$provenance_file"

          line_count="$(wc -l < "$provenance_file" | tr -d '[:space:]')"
          test "$line_count" -eq 6

      - name: Upload release provenance
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            "precizer_${VERSION}.intoto.jsonl" \
            --clobber
