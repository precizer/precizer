permissions:
  contents: read

name: Release builds

on:
  push:
    tags:
      - "*.*.*"

jobs:
  get_tag_info:
    name: Get tag info & create release
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.tag_message.outputs.version }}
      body: ${{ steps.tag_message.outputs.body }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Get annotated tag message
        id: tag_message
        run: |
          git fetch --depth=1 origin +refs/tags/*:refs/tags/*

          VERSION="${GITHUB_REF#refs/tags/}"

          {
            echo "version=$VERSION"
            echo 'body<<EOF'
            git tag -l --format='%(contents)' "$VERSION"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with gh CLI
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "v${{ github.ref_name }}" \
            --notes "${{ steps.tag_message.outputs.body }}" \
            --draft

  build_linux_x86_64:
    name: Build & attach Linux x86_64
    runs-on: ubuntu-24.04
    needs: get_tag_info

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      VERSION: ${{ needs.get_tag_info.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make libpcre2-dev llvm upx gh

      - name: Build project (Linux x86_64)
        run: |
          make -j portable
          mkdir v${{ env.VERSION }}
          cp -a precizer v${{ env.VERSION }}/
          zip -r precizer_linux_x86_64_portable.zip v${{ env.VERSION }}/
          ZIP_COMMENT="Linux x86_64 static portable binary (single executable)"
          echo "$ZIP_COMMENT" | zip -z precizer_linux_x86_64_portable.zip
          ./precizer --version
          make purge

      - name: Run tests (Linux x86_64)
        run: make -j tests

      - name: Generate attestation (Linux x86_64)
        id: attest_linux_x86_64
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: precizer_linux_x86_64_portable.zip

      - name: Save Sigstore bundle (Linux x86_64)
        run: |
          cp "${{ steps.attest_linux_x86_64.outputs.bundle-path }}" \
             "precizer_linux_x86_64_portable.zip.sigstore.json"

      - name: Upload Linux x86_64 asset
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            "precizer_linux_x86_64_portable.zip" \
            "precizer_linux_x86_64_portable.zip.sigstore.json" \
            --clobber
          #
          # Testing automation for downloading and unarchiving new versions (example from the README documentation)
          #
          # Download
          wget -O precizer.zip -q "https://github.com/precizer/precizer/releases/latest/download/precizer_$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/darwin/macos/')_$(uname -m | sed 's/amd64/x86_64/')$( [ "$(uname -s)" = "Linux" ] && echo '_portable' ).zip"
          wget -O precizer.zip.sigstore.json -q "https://github.com/precizer/precizer/releases/latest/download/precizer_$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/darwin/macos/')_$(uname -m | sed 's/amd64/x86_64/')$( [ "$(uname -s)" = "Linux" ] && echo '_portable' ).zip.sigstore.json"
          # Extract the archive
          unzip -jqo precizer.zip '*/precizer' -d ./
          # Run
          ./precizer --version

  build_linux_arm64:
    name: Build & attach Linux arm64
    runs-on: ubuntu-24.04-arm
    needs: get_tag_info

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      VERSION: ${{ needs.get_tag_info.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make libpcre2-dev llvm gh

      - name: Build project (Linux arm64)
        run: |
          # UPX is disabled on Linux ARM64 because UPX-compressed binaries currently core dump at runtime
          # TODO: Remove this legacy workaround after UPX-compressed Linux ARM64 binaries run reliably
          make -j portable UPX=true
          mkdir v${{ env.VERSION }}
          cp -a .builds/portable/precizer v${{ env.VERSION }}/
          zip -r precizer_linux_aarch64_portable.zip v${{ env.VERSION }}/
          ZIP_COMMENT="Linux arm64 static portable binary (single executable)"
          echo "$ZIP_COMMENT" | zip -z precizer_linux_aarch64_portable.zip
          ./.builds/portable/precizer --version
          make purge

      - name: Run tests (Linux arm64)
        run: make -j tests

      - name: Generate attestation (Linux arm64)
        id: attest_linux_arm64
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: precizer_linux_aarch64_portable.zip

      - name: Save Sigstore bundle (Linux arm64)
        run: |
          cp "${{ steps.attest_linux_arm64.outputs.bundle-path }}" \
             "precizer_linux_aarch64_portable.zip.sigstore.json"

      - name: Upload Linux arm64 asset
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            "precizer_linux_aarch64_portable.zip" \
            "precizer_linux_aarch64_portable.zip.sigstore.json" \
            --clobber
          #
          # Testing automation for downloading and unarchiving new versions (example from the README documentation)
          #
          # Download
          wget -O precizer.zip -q "https://github.com/precizer/precizer/releases/latest/download/precizer_$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/darwin/macos/')_$(uname -m | sed 's/amd64/x86_64/')$( [ "$(uname -s)" = "Linux" ] && echo '_portable' ).zip"
          wget -O precizer.zip.sigstore.json -q "https://github.com/precizer/precizer/releases/latest/download/precizer_$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/darwin/macos/')_$(uname -m | sed 's/amd64/x86_64/')$( [ "$(uname -s)" = "Linux" ] && echo '_portable' ).zip.sigstore.json"
          # Extract the archive
          unzip -jqo precizer.zip '*/precizer' -d ./
          # Run
          ./precizer --version

  build_evil_empire_os_arm64:
    name: Build & attach macOS arm64
    runs-on: macos-latest
    needs: get_tag_info

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      VERSION: ${{ needs.get_tag_info.outputs.version }}

    steps:
      - name: Checkout repository (exclude tests/fixtures/long)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !tests/fixtures/long/**

      - name: Install dependencies
        run: |
          brew update
          brew install llvm argp-standalone || true

      - name: Build project (macOS arm64)
        run: |
          make -j dynamic-production
          otool -L precizer
          otool -l precizer
          mkdir v${{ env.VERSION }}
          cp -a precizer v${{ env.VERSION }}/
          zip -r precizer_macos_arm64.zip v${{ env.VERSION }}/
          ./precizer --version
          make purge

      - name: Run tests (macOS arm64)
        run: make -j tests

      - name: Generate attestation (macOS arm64)
        id: attest_macos_arm64
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: precizer_macos_arm64.zip

      - name: Save Sigstore bundle (macOS arm64)
        run: |
          cp "${{ steps.attest_macos_arm64.outputs.bundle-path }}" \
             "precizer_macos_arm64.zip.sigstore.json"

      - name: Upload macOS arm64 asset
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            "precizer_macos_arm64.zip" \
            "precizer_macos_arm64.zip.sigstore.json" \
            --clobber
          #
          # Testing automation for downloading and unarchiving new versions (example from the README documentation)
          #
          # Download
          wget -O precizer.zip -q "https://github.com/precizer/precizer/releases/latest/download/precizer_$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/darwin/macos/')_$(uname -m | sed 's/amd64/x86_64/')$( [ "$(uname -s)" = "Linux" ] && echo '_portable' ).zip"
          wget -O precizer.zip.sigstore.json -q "https://github.com/precizer/precizer/releases/latest/download/precizer_$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/darwin/macos/')_$(uname -m | sed 's/amd64/x86_64/')$( [ "$(uname -s)" = "Linux" ] && echo '_portable' ).zip.sigstore.json"
          # Extract the archive
          unzip -jqo precizer.zip '*/precizer' -d ./
          # Run
          ./precizer --version

  build_windows_x64:
    name: Build & attach Windows x64
    runs-on: windows-latest
    needs: get_tag_info

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      VERSION: ${{ needs.get_tag_info.outputs.version }}

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf input

      - name: Checkout repository (exclude tests/fixtures/long)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !tests/fixtures/long/**

      - name: Install Cygwin dependencies
        uses: cygwin/cygwin-install-action@3f0a3f9f988f7e96b8c18098ae05eaec175f5b52 # v6
        with:
          packages: |
            gcc-core
            libargp-devel
            libpcre2-devel
            libsqlite3-devel
            make
            upx

      - name: Build and stage Cygwin executable
        shell: bash --noprofile --norc -e -o pipefail -o igncr {0}
        run: |
          set -euo pipefail

          case "$(uname -s)" in
            CYGWIN*) ;;
            *)
              echo "Expected Cygwin shell, got $(uname -s)" >&2
              exit 1
              ;;
          esac

          project_dir="$(cygpath -u "$GITHUB_WORKSPACE")"

          cd "$project_dir"
          make dynamic-production WFLAGS=

          built_exe=".builds/dynamic-production/precizer.exe"
          if [ ! -f "$built_exe" ]; then
            built_exe=".builds/dynamic-production/precizer"
          fi
          if [ ! -f "$built_exe" ]; then
            echo "Dynamic production executable not found" >&2
            exit 1
          fi

          rm -rf package
          mkdir -p package/cygwin
          cp "$built_exe" package/cygwin/precizer.exe

          cygcheck "$built_exe" | tee package/cygwin-dependencies.txt
          while IFS= read -r dependency
          do
            dependency="${dependency#"${dependency%%[![:space:]]*}"}"
            if [[ "$dependency" != *.dll ]]; then
              continue
            fi

            dependency_unix="$(cygpath -u "$dependency" 2>/dev/null || true)"
            if [ -z "$dependency_unix" ]; then
              continue
            fi

            dependency_name="$(basename "$dependency_unix")"
            if [[ -f "$dependency_unix" && "$dependency_name" == cyg*.dll ]]; then
              cp -f "$dependency_unix" package/cygwin/
            fi
          done < package/cygwin-dependencies.txt

          test -f package/cygwin/cygwin1.dll
          test -f package/cygwin/cygargp-0.dll
          test -f package/cygwin/cygpcre2-8-0.dll
          test -f package/cygwin/cygsqlite3-0.dll

          ls -la package/cygwin

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build portable wrapper with NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = "${env:ProgramFiles}\NSIS\makensis.exe"
          }
          if (-not (Test-Path $makensis)) {
            throw "makensis.exe was not found"
          }

          $script = Join-Path $env:GITHUB_WORKSPACE ".github\workflows\cygwin.nsi"
          $staging = Join-Path $env:GITHUB_WORKSPACE "package\cygwin"
          $output = Join-Path $env:GITHUB_WORKSPACE "package\precizer.exe"

          & $makensis /NOCD "/DOUTPUT_EXE=$output" "/DSTAGING_DIR=$staging" $script
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path $output)) {
            throw "Portable executable was not created"
          }

      - name: Create Windows x64 archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $versionDir = "v${env:VERSION}"
          New-Item -ItemType Directory -Force -Path $versionDir | Out-Null
          Copy-Item -Path "package\precizer.exe" -Destination $versionDir

          Compress-Archive `
            -Path $versionDir `
            -DestinationPath "precizer_windows_x64_portable.zip" `
            -Force

      - name: Generate attestation (Windows x64)
        id: attest_windows_x64
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: precizer_windows_x64_portable.zip

      - name: Save Sigstore bundle (Windows x64)
        shell: pwsh
        run: |
          Copy-Item `
            -Path "${{ steps.attest_windows_x64.outputs.bundle-path }}" `
            -Destination "precizer_windows_x64_portable.zip.sigstore.json"

      - name: Upload Windows x64 asset
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} `
            "precizer_windows_x64_portable.zip" `
            "precizer_windows_x64_portable.zip.sigstore.json" `
            --clobber
