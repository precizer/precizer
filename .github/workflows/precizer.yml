permissions:
  contents: read

name: Release builds

on:
  push:
    tags:
      - "*.*.*"

jobs:
  get_tag_info:
    name: Get tag info & create release
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.release_info.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get release version
        id: release_info
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install latest stable mdq
        run: |
          curl -fsSL \
            https://github.com/yshavit/mdq/releases/latest/download/mdq-linux-x64-musl.tar.gz | \
            tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/mdq" --version

      - name: Render release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/scripts/render-release-notes.sh "$RELEASE_TAG" release-notes.md

      - name: Create GitHub Release with gh CLI
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "Release $RELEASE_TAG" \
            --notes-file release-notes.md \
            --draft

  build_linux_x86_64:
    name: Build & attach Linux x86_64
    runs-on: ubuntu-24.04
    needs: get_tag_info

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make libpcre2-dev llvm upx zip gh

      - name: Build project (Linux x86_64)
        run: |
          make -j portable
          mv precizer.zip precizer_linux_x86_64_portable.zip
          ./.builds/portable/precizer --version
          make purge

      - name: Run tests (Linux x86_64)
        id: tests
        run: |
          date -u '+%Y-%m-%d %H:%M:%S' > "$RUNNER_TEMP/precizer-test-start"
          make -j tests

      - name: Collect test diagnostics (Linux x86_64)
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        run: bash .github/scripts/collect-test-diagnostics.sh "$RUNNER_TEMP/precizer-test-start" "$RUNNER_TEMP/precizer-test-diagnostics"

      - name: Upload test diagnostics (Linux x86_64)
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-diagnostics-linux-x86-64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/precizer-test-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Generate attestation (Linux x86_64)
        id: attest_linux_x86_64
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: precizer_linux_x86_64_portable.zip

      - name: Save Sigstore bundle (Linux x86_64)
        run: |
          cp "${{ steps.attest_linux_x86_64.outputs.bundle-path }}" \
             "precizer_linux_x86_64_portable.zip.sigstore.json"

      - name: Upload Sigstore bundle artifact (Linux x86_64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sigstore-bundle-linux-x86-64
          path: precizer_linux_x86_64_portable.zip.sigstore.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload Linux x86_64 asset
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            "precizer_linux_x86_64_portable.zip" \
            "precizer_linux_x86_64_portable.zip.sigstore.json" \
            --clobber
          #
          # Testing automation for downloading and unarchiving new versions (example from the README documentation)
          #
          # Download
          wget -O "$RUNNER_TEMP/precizer.zip" -q "https://github.com/precizer/precizer/releases/latest/download/precizer_$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/darwin/macos/')_$(uname -m | sed 's/amd64/x86_64/')$( [ "$(uname -s)" = "Linux" ] && echo '_portable' ).zip"
          wget -O "$RUNNER_TEMP/precizer.zip.sigstore.json" -q "https://github.com/precizer/precizer/releases/latest/download/precizer_$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/darwin/macos/')_$(uname -m | sed 's/amd64/x86_64/')$( [ "$(uname -s)" = "Linux" ] && echo '_portable' ).zip.sigstore.json"
          # Extract the archive
          unzip -jqo "$RUNNER_TEMP/precizer.zip" '*/precizer' -d "$RUNNER_TEMP"
          # Run
          "$RUNNER_TEMP/precizer" --version

  build_linux_arm64:
