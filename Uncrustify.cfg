# Remove spaces between type and asterisks
sp_before_ptr_star = force
sp_between_ptr_star = remove            # Spaces between asterisks in multiple pointers
sp_after_ptr_star = remove              # Spaces after asterisks before name
sp_after_ptr_star_func = remove         # Space after pointer star '*' if followed by func proto/def
sp_before_unnamed_ptr_star = force
sp_ptr_star_paren = remove
sp_before_ptr_star_func = force
align_var_def_star_style = 1            # Align pointer stars in variable declarations (0 = no alignment, 1 = align to the left)
sp_sizeof_paren = remove                # Remove space inside sizeof parentheses

# Tab usage
input_tab_size = 8                      # Number of spaces per tab in input
output_tab_size = 8                     # Number of spaces per tab in output
indent_columns = output_tab_size        # Indentation width in columns
indent_with_tabs = 1                    # Use tabs for indentation (1 = yes, 0 = no)
indent_continue = 8                     # Indentation for continued lines

# Basic indentation
indent_switch_case = output_tab_size    # Indentation for 'case' labels inside switch

# Brace placement
nl_fdef_brace = force                   # Newline between function signature and '{'
nl_fdef_brace_cond = force              # Newline between function signature and '{', if signature ends with ')'. Overrides nl_fdef_brace.
nl_if_brace = force                     # if (...)\n{
nl_for_brace = force                    # for (...)\n{
nl_while_brace = force                  # while (...)\n{
nl_func_def_paren = remove              # No newline between function name and opening '(' in definition
nl_func_paren_empty = remove            # No newline between function name and '()' for empty parentheses
nl_func_decl_start = force              # Newline after '(' in function declaration
nl_func_def_start = force               # Newline after '(' in function definition
nl_func_decl_start_single = remove      # Overrides nl_func_decl_start for single parameter
nl_func_def_start_single = remove       # Overrides nl_func_def_start for single parameter
nl_func_decl_args = force               # Newline after each ',' in function declaration
nl_func_def_args = force                # Newline after each ',' in function definition
nl_func_decl_end = remove               # Newline before ')' in function declaration
nl_func_def_end = remove                # Newline before ')' in function definition
nl_func_decl_end_single = remove        # Overrides nl_func_decl_end for single parameter
nl_func_def_end_single = remove         # Overrides nl_func_def_end for single parameter
nl_func_decl_empty = remove             # Newline between '()' in function declaration
nl_func_def_empty = remove              # Newline between '()' in function definition

# Else settings
sp_brace_else = force                   # Space after } before else
sp_else_brace = force                   # Space after else before {
nl_else_brace = remove                  # else { on same line
nl_brace_else = remove                  # } else on same line
nl_elseif_brace = remove
sp_func_def_paren = remove              # Space between function name and '(' in definition
sp_func_proto_paren = remove            # Space between function name and '(' in declaration
sp_func_call_paren_empty = remove       # Space between function name and '()' for no parameters

# Function parameter indentation
indent_func_def_param = true            # Indent function definition parameters
indent_func_proto_param = true          # Indent function prototype parameters
indent_func_call_param = true           # Indent function call parameters
align_func_params_span = 1              # Align parameters within a single function
indent_param = 8                        # Indentation for parameters
indent_paren_close = 2                  # Indentation for closing parenthesis

# Spaces
sp_paren_brace = remove                 # No space between ')' and '{'
sp_fparen_brace = remove                # No space between ')' and '{' in function definitions
sp_before_sparen = remove               # No space before '(' in control statements (e.g., if(...))
sp_inside_sparen = remove               # No space inside parentheses in control statements (e.g., if(...))
sp_after_sparen = remove                # No space after ')' in control statements (e.g., if(...){)
sp_before_square = remove               # No space before '[' in array indexing (e.g., array[idx])
sp_inside_square = remove               # No space inside square brackets in array indexing (e.g., array[idx])
sp_after_comma = remove                 # No space after commas in argument lists (e.g., func(a,b))
sp_inside_fparens = remove              # No space inside empty function parentheses (e.g., func())

# Space control around =
sp_before_assign = force                # One space before =
sp_after_assign = force                 # One space after =
# For declarations and assignments
sp_assign = force                       # Force one space around =

# Empty line settings between blocks
nl_max_blank_in_func = 2                # Maximum number of consecutive blank lines inside a function
nl_before_if = add                      # Add an empty line before 'if'
nl_before_for = add                     # Add an empty line before 'for'
nl_before_while = add                   # Add an empty line before 'while'
nl_before_do = add                      # Add an empty line before 'do'
nl_before_switch = add                  # Add an empty line before 'switch'

# Alignment
align_func_params = true                # Align function parameters vertically
align_typedef_span = 1                  # Align typedefs across multiple lines
nl_collapse_empty_body = true           # Collapse empty bodies into a single line (e.g., if (x) {})

# Other settings
mod_full_brace_if = force               # Always use braces for 'if' statements, even for single-line bodies
mod_full_brace_while = force            # Always use braces for 'while' statements, even for single-line bodies
mod_full_brace_for = force              # Always use braces for 'for' statements, even for single-line bodies

# Structures
nl_struct_brace = remove                # No newline between struct keyword and '{'

# Removing empty lines at the end of the file,
# as well as deleting excessive empty lines in the code.
nl_max = 2                              # Maximum number of consecutive newlines (3 = 2 blank lines)
nl_end_of_file = force                  # Ensure newline at the end of the file
nl_end_of_file_min = 1                  # Minimum number of newlines at the end of the file
